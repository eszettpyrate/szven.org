<!DOCTYPE html>
<title>Vigenére</title>
<style>
html { 
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: black;
}
</style>

<body>
<canvas id="htmlCanvas" width="900" height="1100" style="border: 2px solid black;"></canvas>
</body>

<script>
const canvas = document.getElementById("htmlCanvas");
const ctx = canvas.getContext("2d");

const alphabet  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let text_input  = "HALLO, WELT!";
let text_key    = "GEHEIMNIS";
let text_output = "";
let key	        = ""; update_key();

const output_y  = 1030;

let mouse = { x: 0, y: 0, click: false };

let animating         = false;
let anim_speed_mult   = 1;
let letter_to_animate = 0;
let animation_timer   = 0;

let highlight_y = 0;
let highlight_x = 0;


// TODO doesn't reset properly (esp. when pausing animation and then manually stepping and stuff like that
// TODO: the keyword looping should be made clearer (lightening the looped letters)


function draw() {

	ctx.font = "40px Courier";
	canvas.style.cursor = "auto"; 

	// background
	ctx.fillStyle = "lightblue";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	ctx.fillStyle = "black";
	ctx.fillRect(10, 10, canvas.width-20, canvas.height-20);

	// Play/Pause button
	if (button( (animating)? "⏹️" : "⏯️",
		836, output_y + 45)) { animating = !animating; }

	// Single step of animation
	if (button("▶️", 785, output_y + 45)) { animating = false; animation_step(); }	

	// Continuous animation
	if (animating) {
		animation_timer++
		if (animation_timer >= 30 * anim_speed_mult) {
	
			animation_step();
		
			animation_timer = 0;
			anim_speed_mult *= 0.9
			if (anim_speed_mult < 0.5) { 
				anim_speed_mult = 0.5 }
		}
	}

	// MESSAGE text area
	ctx.fillText("✉️", 20, 55);
	ctx.fillStyle = "lightgreen";
	if (label(55, text_input)) {
		let ret = window.prompt("Text:", text_input)
		if (ret != null) { 
			text_input = postprocess_textinput(ret, 33);
			animation_reset()
			update_key()
		}	
	}

	// KEY text area
	ctx.fillText("🗝️", 20, 110);
	ctx.fillStyle = "salmon";
	if (label(110, key)) {
		let ret = window.prompt("Key:", text_key)
		if (ret != null) {
			text_key = postprocess_textinput(ret, 33);
			animation_reset()
			update_key()
		}	
	}

	// message output
	ctx.fillText("✉️",  20, output_y); ctx.fillText("🔒", 20, output_y);
	ctx.fillStyle = "lightblue";
	if (text_output.length == 0) { ctx.fillText("...", 90, output_y) }
	else { ctx.fillText(text_output, 90, output_y) }


	// trithemius-table
	// - highlights
	ctx.fillStyle = "#2F06";
	ctx.fillRect(37 + 32*highlight_y, 140, 29, 830);
	ctx.fillStyle = "#F208";
	ctx.fillRect(37, 140+ 32*highlight_x, 830, 29);

	ctx.fillStyle = "#Fa08";
	ctx.fillRect(37 + 32*highlight_y, 140+ 32*highlight_x, 29, 29);

	// - buchstaben
	ctx.font = "35px Courier";
	alph = alphabet;
	for (y=0; y<alph.length; y++) {
		for (x=0; x<alph.length; x++) {
			ctx.fillStyle = "white";
			if (x*y==0) { ctx.fillStyle = "lightblue" }
			ctx.fillText(alph[x], 40 + 32*x, 165 + 32*y)
		}
		alph = c_cypher(alph, 1);
	}    


	// resetting 
	mouse.click = false;

setTimeout("draw()", 50);
}
draw();


function animation_step() {
// continue the animation by one step

	if (text_output.length == 0 || text_output.length == text_input.length) {
	// starting from the beginning
		text_output = "";
	} else {
	// continuing the animation
		letter_to_animate++
	}


	while (letter_to_animate <= text_input.length && 
		alphabet.indexOf(text_input[letter_to_animate]) == -1) {
		text_output = [text_output, text_input[letter_to_animate]].join("");
		letter_to_animate++
	}

	text_output = [text_output, 
			v_cypher(text_input[letter_to_animate], 
			key[letter_to_animate])].join("");

	if (letter_to_animate >= text_input.length) {
		letter_to_animate = 0
		animating = false;
		highlight_y = 0;
		highlight_x = 0;
	} else {
		highlight_y = alphabet.indexOf(text_input[letter_to_animate])
		highlight_x = alphabet.indexOf(key[letter_to_animate])
	}
	
}

function animation_reset() {
	letter_to_animate = 0;
	text_output = "";
	highlight_x = 0; 
	highlight_y = 0;
}



// HTML mouse input
canvas.addEventListener("click", function(evt) {
	mouse.click = true;
	addInput(mouse.x, mouse.y)
}, false);

canvas.addEventListener('mousemove', function(evt) {
	var rect = canvas.getBoundingClientRect();
	mouse.x = evt.clientX - rect.left,
	mouse.y = evt.clientY - rect.top
}, false);




function postprocess_textinput(text, length) {
// Clearning up text to work properly for our cyphers
// (removing special characters and limiting its length

	text = text.toUpperCase();

	text = text.replaceAll("Ä", "AE")
	text = text.replaceAll("Ü", "UE")
	text = text.replaceAll("Ö", "OE")
	text = text.replaceAll("ß", "SS")

	text = text.substring(0, length);

	if (text == "") { text = "A" } 
	
	return text;
}

function update_key() {
// Given the user-entered "text_key", we create a valid key for the cypher.
// it needs to be the same length as the message (we just repeat it to match)
// and needs to have spaces that match the message as well.


	// filtering out non-alphabet characters
	for (i=0; i<text_key.length; i++) {
		if (alphabet.indexOf(text_key[i]) == -1) { 
			text_key = text_key.replace(text_key[i], "")
			i--;
		}
	}

	// cant work without a key
	if (text_key == "") { text_key = "A" } 
	key = text_key

	// getting rid of previous spaces
	key = key.replaceAll(" ", "")

	// repeating the key so that it is long enough
	while (key.length < 35) {
		key = [key, key].join("");
	}

	// adding spaces to the key wherever text_input has them
	for (i=0; i<text_input.length; i++) {
		if (text_input[i] == ' ') {
			key = [key.slice(0, i), 
				" ", 
				key.slice(i, key.length)].join("");
		}
	}

	// trimming to appropriate length
	key = key.substring(0, text_input.length);
}





function label(y, text="") {
// draws text on a rectangle of set size
// returns whether the user clicked on it 

	ctx.fillRect(80, y-35, canvas.width-20-80, 45);

	ctx.fillStyle = "black";
	ctx.fillText(text, 85, y)

	if (mouse.x > 20 && mouse.x < canvas.width-10-80 &&
		mouse.y > y-35 && mouse.y < y+12) { 
			canvas.style.cursor = "pointer"; 
			return mouse.click;
	}

	return false
}

function button(icon, x, y) {
// button intended to use a single emoji as its graphic
// returns whether the user clicked on it

	ctx.fillStyle = "darkblue";
	ctx.fillText(icon, x, y)

	if (mouse.x > x && mouse.x < x+50 &&
		mouse.y > y-40 && mouse.y < y+10) {
			canvas.style.cursor = "pointer"; 
			return mouse.click;
	} 
	return false
}


// -------------------------------------------------------------- //

function c_cypher(inp, offset) {

	let out = ""

	// Just rotating every letter by the given amount

	for (i=0; i<inp.length; i++) {

		let cp = inp[i].toUpperCase().codePointAt(0)
		
		if (cp > 90 || cp < 65) { 
			// characters outside the 26-letter 
			// alphabet just get copied.
			out = out.concat(inp[i].toUpperCase())
			continue 
		}

		cp += offset
		if (cp > 90) {
			cp -= 26
		}

		let conv = String.fromCodePoint( cp );
		out = out.concat(conv)
		
	}
	return out
}

function v_cypher(inp="", key="") {
// key must be at least as long as inp!

	let out = ""
	for (i=0; i<inp.length; i++) {
		// Essentially, we have a series of ceasar cyphers.
		// The key for every ceasar cypher is the index of the keyword-letter at that position
		let letter = c_cypher(inp[i], alphabet.indexOf(key))
		out = [out, letter].join("");
	}
	return out
}

</script>
