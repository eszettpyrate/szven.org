<!DOCTYPE html>
<title>VIGENÉRE</title>
<style>
	html {
		font-family: 'Courier';
		align-items: center;
		justify-content: center;
		background-color: #000;
		display: flex;
		height: 100%;
		width: 100%;
	}

</style>

<body>

<canvas id="htmlCanvas" width="900" height="1100" style="border: 2px solid black;"></canvas>

</body>

<script>

const canvas = document.getElementById("htmlCanvas");
const ctx = canvas.getContext("2d");

let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let offset = 16;

let input_text  = "HALLO, WELT!";
let key_text_entered = "GEHEIMNIS";
let key_text    = key_text_entered;
let output_text = ""
handle_keytext();

let mX = 0; // mouse position
let mY = 0;
let mClick = false;

ctx.font = "40px Courier";

let animating = false;
let anim_speed_mult = 1;
let letter_to_animate = 0;
let animation_pause_timer = 0;

let highlight_y = 0;
let highlight_x = 0;
// TODO: completely optional, but we can rubberband animate the highlight values too.


function draw() {

	ctx.font = "40px Courier";
	canvas.style.cursor = "auto"; 

	let cellsize = (canvas.width*0.93) / 26;

	// background
	ctx.fillStyle = "lightblue";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	ctx.fillStyle = "black";
	ctx.fillRect(10, 10, canvas.width-20, canvas.height-20);


	let output_y = 1030;
	// play/ stop button
	let play_button = "⏯️"
	if (animating) { play_button = "⏹️" } 
	if (button(play_button, 836, output_y + 45)) {
		animating = !animating; 
		if (animating) {
			output_text = ""
			anim_speed_mult = 1
			animation_pause_timer = 999
		}
	}
	if (animating) { mClick = false; }

	if (button("▶️", 785, output_y + 45)) {
		animation_step();
	}	


	if (animating) {

		animation_pause_timer++
		if (animation_pause_timer >= 40 * anim_speed_mult) {
			animation_pause_timer = 0;
			animation_step();
			anim_speed_mult *= 0.9
			if (anim_speed_mult < 0.5) { anim_speed_mult = 0.5 }
		}

	}

	// MESSAGE text area
	ctx.fillText("✉️", 20, 55);
	ctx.fillStyle = "lightgreen";
	if (textarea(55, input_text)) {
		let ret = window.prompt("Text:", input_text)
		if (ret != null) { 
			input_text = postprocess_textinput(ret);
			if (input_text == "") { input_text = "A"; }
			handle_keytext()
			
			letter_to_animate = 0; output_text = ""; highlight_x = 0; highlight_y = 0;

		}	
	}

	// KEY text area
	ctx.fillText("🗝️", 20, 110);
	ctx.fillStyle = "salmon";
	if (textarea(110, key_text)) {
		let ret = window.prompt("Key:", key_text_entered)
		if (ret != null) {
			key_text_entered = ret;
			key_text_entered = key_text_entered.replaceAll(" ", "")
			key_text_entered = postprocess_textinput(key_text_entered);
		
			// filtering out non-alphabet characters
			for (i=0; i<key_text_entered.length; i++) {
				if (alphabet.indexOf(key_text_entered[i]) == -1) { 
					key_text_entered = key_text_entered.replace(key_text_entered[i], "")
					i--;
				}
			}

			key_text = key_text_entered 
			if (key_text_entered == "") { key_text = "A" }

			handle_keytext()
			letter_to_animate = 0; output_text = ""; highlight_x = 0; highlight_y = 0;
		}	
	}


	// encrypted message output
	ctx.fillText("✉️",  20, output_y);
	ctx.fillText("🔒", 20, output_y);

	ctx.fillStyle = "lightblue";
	{
		let text = output_text
		if (output_text.length == 0) { text = "..." }
		for (i=0; i<text.length; i++) {
			ctx.fillText(text[i], char_x_by_index(i), output_y)
		}
	}



	// trithemius-table
	//	highlights
	ctx.fillStyle = "#2F06";
	ctx.fillRect(37 + 32*highlight_y, 140, 29, 830);
	ctx.fillStyle = "#F208";
	ctx.fillRect(37, 140+ 32*highlight_x, 830, 29);

	ctx.fillStyle = "#Fa08";
	ctx.fillRect(37 + 32*highlight_y, 140+ 32*highlight_x, 29, 29);


	// 	buchstaben
	ctx.font = "35px Courier";
	alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
	for (y=0; y<alphabet.length; y++) {
		for (x=0; x<alphabet.length; x++) {
			ctx.fillStyle = "white";
			if (x*y==0) { ctx.fillStyle = "lightblue" }
			ctx.fillText(alphabet[x], 40 + 32*x, 165 + 32*y)
		}
		alphabet = c_cypher(alphabet, 1);
	}    
	





	// resetting 
	mClick = false;

setTimeout("draw()", 50);
}
draw();


function animation_step() {

	if (output_text.length < 1 || output_text.length == input_text.length) {
		// starting from the beginning
		output_text = v_cypher(input_text[letter_to_animate], key_text[letter_to_animate]);
		while (letter_to_animate <= input_text.length && 
			alphabet.indexOf(input_text[letter_to_animate]) == -1) {
			letter_to_animate++
			output_text = [output_text, input_text[letter_to_animate]].join("");
		}

		highlight_y = alphabet.indexOf(input_text[letter_to_animate])
		highlight_x = alphabet.indexOf(key_text[letter_to_animate])

	} else {

		letter_to_animate++
		while (letter_to_animate <= input_text.length && 
			alphabet.indexOf(input_text[letter_to_animate]) == -1) {
			output_text = [output_text, input_text[letter_to_animate]].join("");
			letter_to_animate++
		}

		output_text = [output_text, 
				v_cypher(input_text[letter_to_animate], 
				key_text[letter_to_animate])].join("");

		if (letter_to_animate >= input_text.length) {
			letter_to_animate = 0
			animating = false;
			highlight_y = 0;
			highlight_x = 0;
		} else {

			highlight_y = alphabet.indexOf(input_text[letter_to_animate])
			highlight_x = alphabet.indexOf(key_text[letter_to_animate])

		}
	
	}
}


function setCharAt(str,index,chr) {
	// replace a single character of a string
	if(index > str.length-1) return str;
	return str.substring(0,index) + chr + str.substring(index+1);
}


canvas.addEventListener("click", handle_click);
function handle_click() {
	mClick = true;
}

canvas.addEventListener('mousemove', function(evt) {
	var rect = canvas.getBoundingClientRect();
	mX = evt.clientX - rect.left,
	mY = evt.clientY - rect.top
}, false);

function postprocess_textinput(text) {

	text = text.toUpperCase();
	text = text.replaceAll("Ä", "AE")
	text = text.replaceAll("Ü", "UE")
	text = text.replaceAll("Ö", "OE")
	text = text.replaceAll("ß", "SS")

	if (text.length > 32) {
		text = text.substring(0, 33);
	}
	
	return text;
}

function handle_keytext() {

	// getting rid of previous spaces
	key_text = key_text.replaceAll(" ", "")

	// looping, so that it is long enough
	while (key_text.length < 35) {
		key_text = [key_text, key_text].join("");
	}

	// adding spaces wherever the input_text has them.
	for (i=0; i<input_text.length; i++) {
		if (input_text[i] == ' ') {
	
			// insert a space at that index into the key
			key_text = [key_text.slice(0, i), " ", key_text.slice(i, key_text.length)].join("");

		}
	}



	// trimming to appropriate length
	key_text = key_text.substring(0, input_text.length);
}



function char_x_by_index(i) {
	return 85 + i*24 
}

function textarea(y, text="") {

	ctx.fillRect(80, y-35, canvas.width-20-80, 45);

	ctx.fillStyle = "black";
	for (i=0; i<text.length; i++) {
		ctx.fillText(text[i], char_x_by_index(i), y)
	}

	if (animating) { return false }

	// return whether the cursor is on this area	
	if (mX > 20 && mX < canvas.width-10-80 &&
		mY > y-35 && mY < y+12) { 
			canvas.style.cursor = "pointer"; 
			return mClick;
			}
	return false
}

function button(icon, x, y) {

	ctx.fillStyle = "darkblue";
	ctx.fillText(icon, x, y)

	let distance  = Math.sqrt(
		Math.pow(mX-(x+15), 2)
		+ Math.pow(mY-(y-5), 2)
		, 2);

	if (distance < 30) {
		canvas.style.cursor = "pointer"; 
		return mClick;
	} 
	return false
}

function c_cypher(inp, offset) {
	let out = ""

	for (i=0; i<inp.length; i++) {

		let cp = inp[i].toUpperCase().codePointAt(0)
		
		if (cp > 90 || cp < 65) { 
			// characters outside the 26-letter 
			// alphabet just get copied.
			out = out.concat(inp[i].toUpperCase())
			continue 
		}

		cp += offset
		if (cp > 90) {
			cp -= 26
		}

		let conv = String.fromCodePoint( cp );
		out = out.concat(conv)
		
	}
	return out
}

function v_cypher(inp="", key="") {
// key must be at least as long as inp!

	let out = ""
	for (i=0; i<inp.length; i++) {
		let letter = c_cypher(inp[i], alphabet.indexOf(key))
		out = [out, letter].join("");
	}
	return out
}

</script>
