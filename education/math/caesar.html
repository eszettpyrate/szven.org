<!DOCTYPE html>
<title>Caesar</title>
<style>
html { 
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: black;
}
</style>

<body>
<canvas id="htmlCanvas" width="900" height="790" style="border: 2px solid black;"></canvas>
</body>

<script>
const canvas = document.getElementById("htmlCanvas");
const ctx = canvas.getContext("2d");

const alphabet  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let offset      = 16;

let input_text  = "VENI, VIDI, VICI";
let output_text = c_cypher(input_text, offset);
let show_output = true;

let mouse = { x: 0, y: 0, click: false };

ctx.font  = "40px Courier";
const pad = 20;
const cellsize = (canvas.width*0.93) / 26;

let animating         = false;
let anim_speed_mult   = 1;
let letter_to_animate = 0;
let letter_pos_x      = [];
let letter_pos_y      = []; 
let letter_pos_goal_x = [];
let letter_pos_goal_y = [];
let current_letter_has_converted = false;

function draw() {

	canvas.style.cursor = "auto"; 

	// background
	ctx.fillStyle = "lightblue";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	ctx.fillStyle = "black";
	ctx.fillRect(10, 10, canvas.width-20, canvas.height-20);

	// input area background
	ctx.fillStyle = "lightgreen";
	ctx.fillRect(pad, pad, canvas.width - pad*2, 250);


	if (animating) {
		// STOP ANIMATION button
		if (button("🚫", canvas.width - 85, canvas.height - 30 )) {
			animation_end()
		}
		// can only interact with the abort button while playing animation
		mouse.click = false;
 
	} else {

		// input text area 
		if (textarea(pad, pad, canvas.width - pad*2, 250, input_text)) {
			let ret = window.prompt("Text:", input_text)
			if (ret != null) {
				input_text = postprocess_textinput(input_text, 198)
				output_text = c_cypher(input_text, offset);
			}
		}

		// "play animation" button
		if (button("⏯️", canvas.width-70, canvas.height-35)) {
			// animation startup
			animating = true;
			output_text = input_text;
			show_output = false;
			letter_to_animate = 0;
			current_letter_has_converted = false;

			for (i=0; i<input_text.length; i++) {

				letter_pos_x.push(charpos_by_index(i)[0]);	
				letter_pos_y.push(charpos_by_index(i)[1]);
				letter_pos_goal_x.push(letter_pos_x[i])
				letter_pos_goal_y.push(letter_pos_y[i]+425)		
			}
		}

		// setting the cypher keys
		// - increase
		if (button("◀️", 340, 435)) { 
			offset++;
			if (offset > 25) { offset = 0; }
			output_text = c_cypher(input_text, offset);
		}
		// - decrease
		if (button("▶️", 460, 435)) {
			offset--;
			if (offset < 0) { offset = 25; } 
			output_text = c_cypher(input_text, offset);
		}
		// - current number
		let offset_text = (26-offset).toString()
		if (offset_text == "26") { offset_text = "00" }
		if (offset_text.length == 1) { offset_text = "0" + offset_text }
		ctx.fillStyle = "aliceblue";
		ctx.fillText(offset_text, 400, 432)

		// switch key
		if (button("🔀", canvas.width-125, canvas.height-35)) {
			input_text = output_text
			output_text = c_cypher(input_text, offset);
		}
	
		// view output button
		if (button((show_output)? "🙄" : "😑", 
			20,  canvas.height-35)) { show_output = !show_output }	

	} 

	

	// Letter cards
	for (let i=0; i<26; i++) {

		// Green cards 
		ctx.fillStyle = `rgb(
				${ 20  + i * 7 }, 
				${ 200 + i     }, 
				${ 20  + i * 2 })`;
		ctx.fillRect(i*cellsize+32, 320, 
				cellsize-2, cellsize-1);

		ctx.fillStyle = "black";
		ctx.fillText(alphabet[i], 
			cellsize*i + 2 + 32, 283 + cellsize*2 );

		// Red cards 
		ctx.fillStyle = `rgb(
				${ 220 }, 
				${ 40 + (i+offset)%26 * 7 }, 
				${ 40 + (i+offset)%26 * 2 })`;

		ctx.fillRect(i*cellsize+32, 320 + cellsize +5, 
				cellsize-2, cellsize);
	
		ctx.fillStyle = "black";
		let letterIndex = (offset + i)%26;
		ctx.fillText(alphabet[letterIndex], 
			cellsize*i + 2 + 32, 321 + cellsize*2 );

	}


	// output textbox
	ctx.fillStyle = "salmon";
	ctx.fillRect(pad, 455, canvas.width-pad*2, 250)
	ctx.fillStyle = "black";
	{
		let text = "...";
		if (show_output) { 
			text = output_text; 
		}
			if (animating) { text = ""; }

		for (i=0; i<text.length; i++) {
			ctx.fillText(text[i], charpos_by_index(i)[0], charpos_by_index(i)[1]+425)
		}
	}



	// animating
	if (animating) {

		// actual animation logic
		
		// drawing a lighter copy of the letters that have already been animated
		ctx.fillStyle = "#0003"
		for (i=0; i<=letter_to_animate; i++) {
			ctx.fillText(input_text[i], charpos_by_index(i)[0], charpos_by_index(i)[1])
		}

		// drawing the animated letters at their individual positions
		
		for (i=0; i<output_text.length; i++) {
			if (i==letter_to_animate) { 
				ctx.fillStyle = "#F00"
				if (current_letter_has_converted) { ctx.fillStyle = "#0F0" } 
			} else { ctx.fillStyle = "black" }
			ctx.fillText(output_text[i], 
				letter_pos_x[i], letter_pos_y[i])
		}
		


		// if the current letter is a special character, just skip the first animation step.
		if (!alphabet.includes(output_text[letter_to_animate])) { current_letter_has_converted = true }


		if (!current_letter_has_converted) {

			let letter_row_y = 350
			let letter_index = alphabet.indexOf( output_text[letter_to_animate] )
			let letterpos_x  = cellsize*letter_index + 2 + 32 // (same math as for placing the letter cards)

			// rubberbanding to the letter row
			letter_pos_y[letter_to_animate] = 
				letter_pos_y[letter_to_animate] +
				( letter_row_y - letter_pos_y[letter_to_animate] )*0.1*anim_speed_mult; 
			letter_pos_x[letter_to_animate] = 
				letter_pos_x[letter_to_animate] +
				( letterpos_x - letter_pos_x[letter_to_animate] )*0.2*anim_speed_mult; 



			// skipping spaces, snapping into position and converting to the new meaning
			if (input_text[letter_to_animate] == ' ' || 
				letter_pos_y[letter_to_animate] > letter_row_y - 2) {


				// replacing the letter with its encrypted form
				output_text = setCharAt(output_text, letter_to_animate, 
					c_cypher(output_text, offset)[letter_to_animate])
				current_letter_has_converted = true
		
				// snapping into place
				letter_pos_y[letter_to_animate] += cellsize+5 //(gap between the cards) 
				
			}
			


		} else {
		// letter has been converted, now just move to the final position
		
			// rubberbanding the letter end position	
			letter_pos_y[letter_to_animate] = 
				letter_pos_y[letter_to_animate] +
				( letter_pos_goal_y[letter_to_animate] - letter_pos_y[letter_to_animate] )*0.1*anim_speed_mult; 
			letter_pos_x[letter_to_animate] = 
				letter_pos_x[letter_to_animate] +
				( letter_pos_goal_x[letter_to_animate] - letter_pos_x[letter_to_animate] )*0.2*anim_speed_mult; 
	
	
			// skipping spaces, and snapping into place once we are close 
			if (input_text[letter_to_animate] == ' ' || 
				letter_pos_y[letter_to_animate] > letter_pos_goal_y[letter_to_animate]-10) {

				// snapping into place
				letter_pos_x[letter_to_animate] = letter_pos_goal_x[letter_to_animate]
				letter_pos_y[letter_to_animate] = letter_pos_goal_y[letter_to_animate]
				// animate the next letter
				letter_to_animate++
				current_letter_has_converted = false
				anim_speed_mult *= 1.1
				if (anim_speed_mult > 3) { anim_speed_mult = 3 }
				if (letter_to_animate >= 40) { anim_speed_mult = 4 }
			}

		}
		
		if (letter_to_animate >= input_text.length) {
			animation_end()
		}

	}

	// resetting 
	mouse.click = false;

setTimeout("draw()", 50);
}
draw();



function setCharAt(str,index,chr) {
	// replace a single character of a string
	if(index > str.length-1) return str;
	return str.substring(0,index) + chr + str.substring(index+1);
}

function animation_end() {
	anim_speed_mult = 1
	animating = false
	show_output = true
	letter_pos_x = []
	letter_pos_y = []
	letter_pos_goal_x = []
	letter_pos_goal_y = []

}


// HTML mouse input
canvas.addEventListener("click", handle_click);
function handle_click() {
	mouse.click = true;
}

canvas.addEventListener('mousemove', function(evt) {
	var rect = canvas.getBoundingClientRect();
	mouse.x = evt.clientX - rect.left,
	mouse.y = evt.clientY - rect.top
}, false);




function charpos_by_index(i) {
	let chars_per_line = 33
	return [
		53 + (i%chars_per_line)*24, 
		80 + 34*Math.floor(i/chars_per_line) 
		]
}

function textarea(x, y, w, h, text) {

	ctx.fillStyle = "black";

	for (i=0; i<input_text.length; i++) {
		ctx.fillText(input_text[i], charpos_by_index(i)[0], charpos_by_index(i)[1])
	}

	// return whether the cursor is on this area	
	if (mouse.x > x && 
		mouse.x < x+w &&
		mouse.y > y &&
		mouse.y < y+h) { 
			canvas.style.cursor = "pointer"; 
			return mouse.click;
			}
	return false
}

function button(icon, x, y) {
// button intended to use a single emoji as its graphic
// returns whether the user clicked on it

	ctx.fillStyle = "darkblue";
	ctx.fillText(icon, x, y)

	if (mouse.x > x && mouse.x < x+50 &&
		mouse.y > y-40 && mouse.y < y+10) {
			canvas.style.cursor = "pointer"; 
			return mouse.click;
	} 
	return false
}


function postprocess_textinput(text, length) {
// Clearning up text to work properly for our cyphers
// (removing special characters and limiting its length

	text = text.toUpperCase();

	text = text.replaceAll("Ä", "AE")
	text = text.replaceAll("Ü", "UE")
	text = text.replaceAll("Ö", "OE")
	text = text.replaceAll("ß", "SS")

	text = text.substring(0, length);

	if (text == "") { text = "A" } 
	
	return text;
}



function c_cypher(inp, offset) {
	let out = ""

	for (i=0; i<inp.length; i++) {

		let cp = inp[i].toUpperCase().codePointAt(0)
		
		if (cp > 90 || cp < 65) { 
			// characters outside the 26-letter 
			// alphabet just get copied.
			out = out.concat(inp[i].toUpperCase())
			continue 
		}

		cp += offset
		if (cp > 90) {
			cp -= 26
		}

		let conv = String.fromCodePoint( cp );
		out = out.concat(conv)
		
	}
	return out
}


</script>
